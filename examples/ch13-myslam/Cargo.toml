[package]
name = "ch13-myslam"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = { version = "0.11.6", default-features = false, features = [
    "auto-color",
    "humantime",
] }
log = { version = "0.4.25", features = ["serde"] }

# 随机数
rand = "0.8.5"
rand_distr = "0.4.3"

# 线性代数
nalgebra = { version = "0.33.2",features = ["rand"]}

# 3D图形界面
three-d = {path = "../../static/three-d" , features=["egui-gui"] }
three-d-asset = {version = "0.9",features = ["hdr", "http"] }

# 多线程
tokio = "1.43.0"

# rust-cv计算机视觉
cv = { version = "0.6.0" , features = ["default"] }
cv-core = "0.15.0"
cv-pinhole = "0.6.0"
akaze = "0.7.0"

# 图像处理
image = "0.25.5"
imageproc = "0.25.0"

# 图优化
factrs = { version = "0.2.0", features = [] }

# YAML解析
yaml-rust2 = { version = "0.10.0" }

# cli命令行参数解析
clap = { version = "4.5.29", features = ["derive"] }

# 浮点数精度
approx = "0.5.1"

# 依赖覆盖
[patch.crates-io]
pulp = { path = "../../static/pulp" }
mio = { path = "../../static/mio", version = "1.0.3" }

# 伴生库
[lib]
name = "myslam"
path = "./src/lib.rs"
